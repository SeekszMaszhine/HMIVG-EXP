<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de capturista · Hospital</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><div class="logo">✚</div>Hospital Materno Infantil "Vicente Guerrero"</div>
    <h1>Crea tu cuenta</h1>
    <p class="sub">Registro exclusivo para capturistas de información.</p>
    <form id="formRegistro">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required placeholder="nombre@hospital.mx">
      </div>
      <div class="field">
        <label for="password">Contraseña (mínimo 6 caracteres)</label>
        <input type="password" id="password" minlength="6" required placeholder="••••••••">
      </div>
      <button class="btn btn-primary btn-block" type="submit">Registrarme</button>
      <div class="msg" id="msg"></div>
    </form>
    <p class="auth-alt">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    <p class="auth-alt"><a href="index.html">← Volver al inicio</a></p>
  </div>
</div>
<script type="module">
  import { initRegistro } from "./js/auth.js";
  initRegistro();
</script>
</body>
</html>
