<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión · Hospital</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><div class="logo">✚</div>Hospital Materno Infantil "Vicente Guerrero"</div>
    <h1>Bienvenido de nuevo</h1>
    <p class="sub">Acceso para personal capturista de expedientes.</p>
    <form id="formLogin">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required placeholder="nombre@hospital.mx">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button class="btn btn-primary btn-block" type="submit">Iniciar sesión</button>
      <div class="msg" id="msg"></div>
    </form>
    <p class="auth-alt">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
    <p class="auth-alt"><a href="index.html">← Volver al inicio</a></p>
  </div>
</div>
<script type="module">
  import { initLogin } from "./js/auth.js";
  initLogin();
</script>
</body>
</html>
